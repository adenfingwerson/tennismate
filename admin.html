<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Admin Portal - TennistMate</title>
    <style>
        /* Brutalist / Minimalist Admin Theme */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');

        :root {
            --bg: #ffffff;
            --text: #000000;
            --border: #000000;
            --accent: #ccff00;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-weight: 900;
            text-transform: uppercase;
            font-size: 3rem;
            margin-bottom: 40px;
            border-bottom: 4px solid var(--border);
            padding-bottom: 16px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
        }

        .roster-panel {
            border: 2px solid var(--border);
            padding: 20px;
            height: calc(100vh - 160px);
            overflow-y: auto;
            background: #f9fafb;
        }

        .roster-title {
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .player-card {
            padding: 16px;
            border: 2px solid var(--border);
            margin-bottom: 12px;
            cursor: pointer;
            background: var(--bg);
            transition: all 0.2s;
        }

        .player-card:hover, .player-card.active {
            background: var(--accent);
            transform: translateX(4px);
            box-shadow: -4px 4px 0 var(--border);
        }

        .player-name {
            font-weight: 800;
            font-size: 1.1rem;
        }
        
        .player-email {
            font-size: 0.85rem;
            color: #666;
        }

        .lesson-panel {
            border: 2px solid var(--border);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
        }

        .tm-textarea {
            width: 100%;
            height: 300px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            padding: 16px;
            border: 2px solid var(--border);
            background: #f9fafb;
            resize: vertical;
        }

        .tm-textarea:focus {
            outline: none;
            background: var(--bg);
            box-shadow: 4px 4px 0 var(--border);
        }

        .btn {
            background-color: var(--text);
            color: var(--bg);
            padding: 16px 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 2px solid var(--border);
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
        }

        .btn:hover {
            background-color: var(--accent);
            color: var(--text);
        }
    </style>
</head>
<body>

    <h1>Coach Admin Portal</h1>

    <div id="pin-guard" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; align-items: center; justify-content: center; flex-direction: column;">
        <h2 style="margin-bottom: 24px; font-size: 2rem; text-transform: uppercase;">Admin Access PIN</h2>
        <input type="password" id="admin-pin" placeholder="••••" style="width: 200px; text-align: center; font-size: 2rem; letter-spacing: 0.2em; padding: 16px; border: 4px solid var(--border); background: #f9fafb; font-family: 'Inter', sans-serif; font-weight: 900; margin-bottom: 24px; outline: none;">
        <button class="btn" style="width: 200px; padding: 16px; font-size: 1.2rem;" onclick="verifyPin()">Unlock</button>
    </div>

    <div class="admin-grid" id="auth-guard" style="display: none;">
        
        <!-- Sidebar: Player Roster -->
        <div class="roster-panel">
            <div class="roster-title">Player Roster</div>
            <div id="roster-list">
                <!-- Players injected here by JS -->
                Loading players...
            </div>
        </div>

        <!-- Main Area: Log Lesson -->
        <div class="lesson-panel" id="lesson-workspace" style="opacity: 0.5; pointer-events: none;">
            <div class="panel-header">
                <div>
                    <h2 id="active-player-name" style="margin-bottom: 8px;">Select a player</h2>
                    <button id="delete-player-btn" onclick="deletePlayer()" style="display: none; background: #ff4c4c; color: white; border: none; padding: 4px 8px; cursor: pointer; font-weight: bold; font-family: 'Inter'; text-transform: uppercase; font-size: 0.75rem;">Delete Player</button>
                </div>
                <input type="date" id="lesson-date" style="padding: 8px; border: 2px solid #000; font-family: Inter;">
            </div>

            <div>
                <label style="font-weight: 900; text-transform: uppercase; display: block; margin-bottom: 8px;">Raw Notebook Dump</label>
                <textarea class="tm-textarea" id="lesson-notes" placeholder="Paste your raw notes from the court here..."></textarea>
            </div>

            <button class="btn" onclick="saveLesson()">Log Session to Database</button>

            <!-- Automation trigger (future) -->
            <button class="btn" id="ai-btn" style="background: var(--accent); color: var(--text); margin-top: -8px;" onclick="generateAiPlan()">
                Generate AI Tactical Plan &rarr;
            </button>
            <div id="ai-output" style="white-space: pre-wrap; font-family: monospace; font-size: 0.9rem; background: #000; color: #ccff00; padding: 16px; display: none;"></div>
        </div>

    </div>

    <script>
        let selectedUserId = null;

        // Security check - rough frontend gate (API enforces strictly)
        document.addEventListener('DOMContentLoaded', async () => {
            const email = localStorage.getItem('tm_user_email');
            if(email !== 'aden.f.ingwerson@gmail.com') {
                document.body.innerHTML = '<h1 style="text-align:center; margin-top:20vh;">Unauthorized. Coach access only.</h1>';
                return;
            }
            // Show PIN guard
            document.getElementById('pin-guard').style.display = 'flex';
        });

        function verifyPin() {
            const pin = document.getElementById('admin-pin').value;
            if (pin === '1743') {
                localStorage.setItem('tm_admin_pin', pin);
                document.getElementById('pin-guard').style.display = 'none';
                document.getElementById('auth-guard').style.display = 'grid';
                document.getElementById('lesson-date').valueAsDate = new Date();
                loadRoster();
            } else {
                alert('Invalid PIN.');
                document.getElementById('admin-pin').value = '';
            }
        }

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'X-Admin-Pin': localStorage.getItem('tm_admin_pin') || ''
            };
        }

        // Allow hitting Enter to submit PIN
        document.getElementById('admin-pin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                verifyPin();
            }
        });

        async function loadRoster() {
            try {
                const res = await fetch('/api/admin/roster', { headers: getAuthHeaders() });
                const data = await res.json();
                
                const rosterList = document.getElementById('roster-list');
                rosterList.innerHTML = '';

                data.users.forEach(user => {
                    const div = document.createElement('div');
                    div.className = 'player-card';
                    div.innerHTML = `
                        <div class="player-name">${user.email.split('@')[0]}</div>
                        <div class="player-email">${user.email}</div>
                    `;
                    div.onclick = () => selectPlayer(user.id, user.email, div);
                    rosterList.appendChild(div);
                });
            } catch (e) {
                document.getElementById('roster-list').innerHTML = 'Error loading roster.';
            }
        }

        function selectPlayer(id, email, cardElement) {
            selectedUserId = id;
            document.getElementById('active-player-name').innerText = email;
            document.getElementById('delete-player-btn').style.display = 'inline-block';
            document.getElementById('ai-output').style.display = 'none';
            
            // Unlock workspace
            document.getElementById('lesson-workspace').style.opacity = '1';
            document.getElementById('lesson-workspace').style.pointerEvents = 'auto';

            // Highlight card
            document.querySelectorAll('.player-card').forEach(c => c.classList.remove('active'));
            cardElement.classList.add('active');
        }

        async function deletePlayer() {
            if(!selectedUserId) return;
            if(!confirm("Are you sure you want to permanently delete this player and all their data?")) return;

            try {
                const res = await fetch('/api/admin/delete_user', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ user_id: selectedUserId })
                });

                if(res.ok) {
                    alert('Player deleted.');
                    document.getElementById('lesson-workspace').style.opacity = '0.5';
                    document.getElementById('lesson-workspace').style.pointerEvents = 'none';
                    document.getElementById('delete-player-btn').style.display = 'none';
                    selectedUserId = null;
                    loadRoster();
                }
            } catch(e) {
                alert('Error deleting player.');
            }
        }

        async function saveLesson() {
            if(!selectedUserId) return;
            
            const date = document.getElementById('lesson-date').value;
            const notes = document.getElementById('lesson-notes').value;

            try {
                const res = await fetch('/api/admin/lessons', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        user_id: selectedUserId,
                        lesson_date: date,
                        raw_notes: notes
                    })
                });

                if(res.ok) {
                    alert('Lesson logged to database!');
                    document.getElementById('lesson-notes').value = '';
                }
            } catch(e) {
                alert('Error saving lesson.');
            }
        }

        async function generateAiPlan() {
            if(!selectedUserId) return;
            
            const btn = document.getElementById('ai-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Analyzing...';
            btn.style.opacity = '0.7';

            try {
                const res = await fetch('/api/admin/generate', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ user_id: selectedUserId })
                });

                const data = await res.json();
                
                if(data.success) {
                    const out = document.getElementById('ai-output');
                    out.style.display = 'block';
                    out.innerText = data.ai_plan;
                } else {
                    alert('AI Error: ' + data.error);
                }
            } catch(e) {
                alert('Connection error talking to AI engine.');
            } finally {
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
