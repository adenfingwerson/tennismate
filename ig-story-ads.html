<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IG Story Ads</title>
<style>
  body { margin: 0; background: #333; display: flex; gap: 20px; padding: 20px; overflow-x: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .story {
    width: 390px;
    height: 844px; /* iPhone 12/13/14 size */
    background: #000;
    color: #fff;
    position: relative;
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
  }
  .story::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, rgba(204,255,0,0.2) 0%, rgba(0,0,0,1) 50%);
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 2;
    width: 100%;
  }
  h1 {
    font-size: 48px;
    font-weight: 800;
    line-height: 1.1;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .accent { color: #ECD06F; }
  p {
    font-size: 24px;
    font-weight: 500;
    color: #aaa;
    margin-bottom: 40px;
  }
  .sticker {
    background: #fff;
    color: #000;
    padding: 20px 40px;
    border-radius: 12px;
    font-size: 24px;
    font-weight: 800;
    text-transform: uppercase;
    display: inline-block;
  }
</style>
</head>
<body>

  <!-- Ad 1 -->
  <div class="story">
    <div class="content">
      <h1>Your backhand shouldn't be a <span class="accent">liability</span>.</h1>
      <p>1-on-1 High School Coaching in Nebraska.</p>
      <div class="sticker">🔗 Book $25 Lesson</div>
    </div>
  </div>

  <!-- Ad 2 -->
  <div class="story">
    <div class="content" style="text-align: left;">
      <h1 style="font-size: 64px;">STOP<br>GUESSING.</h1>
      <p style="color: #fff; font-size: 28px; line-height: 1.4;">Get modern stroke mechanics in 1 hour.</p>
      <div class="sticker" style="background: #ECD06F;">🔗 Hastings & Holdrege</div>
    </div>
  </div>

</body>
</html>
