<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis T-Mate - Connect</title>
    <style>
        :root {
            --bg: #FAFAFA;
            --bg-card: #FFFFFF;
            --text: #212413;
            --text-muted: #6B705C;
            --border: #E8EBE0;
            --accent: #B3E6B5;
            --radius-pill: 100px;
            --radius-card: 32px;
            --shadow-soft: 0 12px 32px rgba(33, 36, 19, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none; /* Custom cursor */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* CUSTOM CURSOR */
        #cursor {
            position: fixed;
            top: 0; left: 0;
            width: 20px; height: 20px;
            background-color: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: difference;
            z-index: 10000;
            transition: transform 0.1s ease;
        }
        .hover-target:hover ~ #cursor,
        a:hover ~ #cursor,
        button:hover ~ #cursor,
        .contact-option:hover ~ #cursor {
            transform: scale(3);
        }

        @media (hover: none) and (pointer: coarse) {
            #cursor { display: none !important; }
            * { cursor: auto !important; }
        }

        /* SVG BACKGROUND ANIMATIONS */
        #tennis-anim-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.15;
            overflow: hidden;
        }
        
        /* Players */
        #p1 { transition: all 0.5s ease; transform: translate(400px, 480px); }
        #p2 { transition: all 0.5s ease; transform: translate(400px, 150px) scale(0.6); }
        
        /* Ball default rally */
        @keyframes rallyBall {
            0% { transform: translate(350px, 420px); }
            50% { transform: translate(450px, 200px); }
            100% { transform: translate(350px, 420px); }
        }
        svg:not(.anim-active) #anim-ball {
            animation: rallyBall 2s infinite ease-in-out;
        }

        /* Specific Shot Animations */
        @keyframes fhWin {
            0% { transform: translate(450px, 200px); } 
            30% { transform: translate(300px, 450px); } 
            100% { transform: translate(600px, 100px); } 
        }
        svg.anim-fh #anim-ball { animation: fhWin 1.5s forwards cubic-bezier(0.2, 0.8, 0.2, 1); }
        svg.anim-fh #p1 { transform: translate(300px, 480px) rotate(-15deg); }
        
        @keyframes bhWin {
            0% { transform: translate(350px, 200px); } 
            30% { transform: translate(500px, 450px); } 
            100% { transform: translate(200px, 100px); } 
        }
        svg.anim-bh #anim-ball { animation: bhWin 1.5s forwards cubic-bezier(0.2, 0.8, 0.2, 1); }
        svg.anim-bh #p1 { transform: translate(500px, 480px) rotate(15deg); }

        @keyframes volleyWin {
            0% { transform: translate(400px, 500px); } 
            30% { transform: translate(350px, 250px); } 
            100% { transform: translate(200px, 550px); } 
        }
        svg.anim-volley #anim-ball { animation: volleyWin 1.5s forwards cubic-bezier(0.2, 0.8, 0.2, 1); }
        svg.anim-volley #p2 { transform: translate(350px, 250px) scale(0.8); }

        @keyframes aceWin {
            0% { transform: translate(400px, 150px); } 
            100% { transform: translate(200px, 600px); } 
        }
        svg.anim-ace #anim-ball { animation: aceWin 1s forwards cubic-bezier(0.5, 0, 1, 0.5); }
        svg.anim-ace #p2 { transform: translate(400px, 150px) scale(0.7) rotate(20deg); }
        svg.anim-ace #p1 { transform: translate(500px, 480px); } 


        /* MODAL STYLES */
        .modal-content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 24px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .booking-step {
            display: none;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            padding: 48px 32px;
            box-shadow: var(--shadow-soft);
            animation: slideIn 0.3s ease forwards;
        }
        .booking-step.active {
            display: block;
        }
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .fs-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            text-align: center;
            margin-bottom: 40px;
            color: var(--text);
            text-transform: uppercase;
        }
        
        .fs-subtitle {
            text-align: center;
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .contact-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .contact-option {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            padding: 24px 32px;
            border-radius: var(--radius-pill);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 4px 12px rgba(33, 36, 19, 0.05);
            border: 2px solid transparent;
        }
        .contact-option:hover {
            background: var(--accent);
            transform: scale(1.02);
            box-shadow: var(--shadow-soft);
        }
        .contact-title {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }

        .fs-input {
            width: 100%;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 20px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 1.25rem;
            color: var(--text);
            margin-bottom: 16px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(33, 36, 19, 0.02);
        }
        .fs-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(179, 230, 181, 0.3);
        }

        .fs-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--text);
            color: var(--accent);
            border: none;
            border-radius: var(--radius-pill);
            padding: 20px 32px;
            font-size: 1.25rem;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
        }
        .fs-btn:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-soft);
        }
        .fs-btn-back {
            background: var(--border);
            color: var(--text);
            width: auto;
            padding: 20px;
            border-radius: 50%;
        }
        .fs-btn-back:hover {
            background: var(--text-muted);
            color: var(--bg);
        }

        /* The Close X in top right */
        .page-close {
            position: fixed;
            top: 32px;
            right: 32px;
            font-size: 3rem;
            color: var(--text);
            z-index: 100;
            opacity: 0.5;
            transition: opacity 0.3s;
            text-decoration: none;
            line-height: 1;
        }
        .page-close:hover { opacity: 1; }
    </style>
</head>
<body>
    <div id="cursor"></div>

    <!-- BUBBLE STICK FIGURE BACKGROUND -->
    <div id="tennis-anim-bg">
        <svg id="tennis-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" style="width:100%; height:100%;">
            <!-- Court Lines -->
            <polygon points="150,550 650,550 500,100 300,100" fill="none" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
            <line x1="225" y1="325" x2="575" y2="325" stroke="#000000" stroke-width="6" stroke-dasharray="10,10"/>
            <line x1="400" y1="550" x2="400" y2="325" stroke="#000000" stroke-width="3"/>
            <line x1="400" y1="325" x2="400" y2="100" stroke="#000000" stroke-width="3"/>
            
            <!-- P2 (Coach/Top) -->
            <g id="p2">
                <circle cx="0" cy="-60" r="24" fill="#000000"/>
                <path d="M0,-36 L0,20 M0,-15 L-35,5 M0,-15 L35,-5 M0,20 L-25,65 M0,20 L25,65" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <line x1="35" y1="-5" x2="55" y2="-45" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
                <ellipse cx="55" cy="-45" rx="15" ry="22" fill="none" stroke="#000000" stroke-width="5" transform="rotate(30 55 -45)"/>
            </g>

            <!-- P1 (You/Bottom) -->
            <g id="p1">
                <circle cx="0" cy="-60" r="24" fill="#000000"/>
                <path d="M0,-36 L0,20 M0,-15 L-35,5 M0,-15 L35,-5 M0,20 L-25,65 M0,20 L25,65" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <line x1="35" y1="-5" x2="55" y2="-45" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
                <ellipse cx="55" cy="-45" rx="15" ry="22" fill="none" stroke="#000000" stroke-width="5" transform="rotate(30 55 -45)"/>
            </g>

            <!-- Ball -->
            <circle id="anim-ball" cx="0" cy="0" r="10" fill="#B3E6B5" stroke="#000000" stroke-width="3"/>
        </svg>
    </div>

    <a href="/" class="page-close hover-target">&times;</a>

    <div class="modal-content-wrapper">
        
        <!-- STEP 1: Connect -->
        <div class="booking-step active" id="step-contact">
            <h2 class="fs-title">Connect</h2>
            <div class="contact-grid">
                <div class="contact-option hover-target" onclick="nextContactStep('call')">
                    <span class="contact-title">Schedule a Call</span>
                </div>
                <div class="contact-option hover-target" onclick="nextContactStep('text')">
                    <span class="contact-title">Send a Text</span>
                </div>
                <a href="tel:3089910173" class="contact-option hover-target">
                    <span class="contact-title">Call Now</span>
                </a>
            </div>
            <div style="margin-top: 16px; text-align: center;">
                <button type="button" class="fs-btn fs-btn-back hover-target" onclick="nextContactStep(1)">
                    &larr;
                </button>
            </div>
        </div>

        <!-- STEP 3: Call -->
        <div class="booking-step" id="step-call">
            <h2 class="fs-title">Schedule</h2>
            <input type="text" id="c_name" class="fs-input hover-target" placeholder="Your Name" required>
            <input type="tel" id="c_phone" class="fs-input hover-target" placeholder="Phone Number" required>
            <input type="text" id="c_time" class="fs-input hover-target" placeholder="Preferred Day & Time" required>
            <div style="display: flex; gap: 16px; margin-top: 8px;">
                <button type="button" class="fs-btn fs-btn-back hover-target" onclick="nextContactStep('contact')">
                    &larr;
                </button>
                <button type="button" class="fs-btn hover-target" onclick="submitContact('call')">Confirm</button>
            </div>
        </div>

        <!-- STEP 4: Text -->
        <div class="booking-step" id="step-text">
            <h2 class="fs-title">Details</h2>
            <input type="text" id="t_name" class="fs-input hover-target" placeholder="Your Name" required>
            <input type="tel" id="t_phone" class="fs-input hover-target" placeholder="Phone Number" required>
            <div style="display: flex; gap: 16px; margin-top: 8px;">
                <button type="button" class="fs-btn fs-btn-back hover-target" onclick="nextContactStep('contact')">
                    &larr;
                </button>
                <button type="button" class="fs-btn hover-target" onclick="submitContact('text')">Send</button>
            </div>
        </div>
        
        <!-- STEP 5: Success -->
        <div class="booking-step" id="step-success" style="text-align: center;">
            <div style="width: 80px; height: 80px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 32px;">
                <span style="font-size: 2rem; color: var(--text);">✓</span>
            </div>
            <h2 class="fs-title" style="margin-bottom: 16px;">Received.</h2>
            <p class="fs-subtitle">I'll be in touch shortly.</p>
            <a href="/" class="fs-btn hover-target">Close</a>
        </div>

    </div>

    <!-- CUSTOM CURSOR JS -->
    <script>
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX - 10 + 'px';
            cursor.style.top = e.clientY - 10 + 'px';
        });

        , 1600);
        }

        function nextContactStep(stepId, focusVal = null) {
            if (focusVal) {
                document.getElementById('b_focus').value = focusVal;
            }

            document.querySelectorAll('.booking-step').forEach(el => {
                el.classList.remove('active');
            });
            
            
            if (stepId === 1 || stepId === 'contact') {
                const el = document.getElementById('step-contact');
                if (el) el.classList.add('active');

            } else {
                document.getElementById('step-' + stepId).classList.add('active');
            }
        }
        
        async function submitContact(type) {
            let payload = {};
            if (type === 'call') {
                const name = document.getElementById('c_name').value;
                const phone = document.getElementById('c_phone').value;
                const time = document.getElementById('c_time').value;
                if(!name || !phone || !time) { alert("Please fill all fields"); return; }
                
                payload = { name, phone, location: 'N/A', preferred_time: time, focus: 'Schedule Call' };
            } else if (type === 'text') {
                const name = document.getElementById('t_name').value;
                const phone = document.getElementById('t_phone').value;
                if(!name || !phone) { alert("Please fill all fields"); return; }
                
                payload = { name, phone, location: 'N/A', preferred_time: 'ASAP', focus: 'Send Text' };
            }

            nextContactStep('success');

            try {
                await fetch('/api/book', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Submission error", err);
            }
        }
    </script>
</body>
</html>
